[platformio]
src_dir = firmware/arduino_uno/AutoSnakeUno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200
monitor_filters = time

[env:uno-student]
extends = env:uno
build_flags =
  -DAUTOSNAKE_STUDENT_BOT
  -I .station-runtime/level3
  -I learning/level3

[env:virtual]
platform = native
build_flags =
  -DAUTOSNAKE_VIRTUAL
  -DAUTOSNAKE_VIRTUAL_LEVEL=1
  -I firmware/virtual_arduino
  -std=c++17

[env:virtual-student]
extends = env:virtual
build_flags =
  -DAUTOSNAKE_VIRTUAL
  -DAUTOSNAKE_STUDENT_BOT
  -DAUTOSNAKE_VIRTUAL_LEVEL=3
  -I firmware/virtual_arduino
  -I .station-runtime/level3
  -I learning/level3
  -std=c++17

[env:virtual-rules]
extends = env:virtual
build_flags =
  -DAUTOSNAKE_VIRTUAL
  -DAUTOSNAKE_STUDENT_BOT
  -DAUTOSNAKE_VIRTUAL_LEVEL=1
  -I firmware/virtual_arduino
  -I .station-runtime/level1
  -std=c++17

[env:virtual-python]
extends = env:virtual
build_flags =
  -DAUTOSNAKE_VIRTUAL
  -DAUTOSNAKE_EXTERNAL_BOT
  -DAUTOSNAKE_VIRTUAL_LEVEL=2
  -I firmware/virtual_arduino
  -std=c++17
